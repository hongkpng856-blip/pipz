name: Pipz
options:
  bundleIdPrefix: com.anthroskill
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Pipz:
    type: application
    platform: iOS
    sources:
      - path: Pipz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthroskill.pipz
        INFOPLIST_FILE: Pipz/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      # shared scheme — CI（Xcode Cloud / GitHub Actions）要靠佢先識 build
      testTargets: []
      gatherCoverageData: false
