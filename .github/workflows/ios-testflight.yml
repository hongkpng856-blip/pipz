name: iOS → TestFlight

# 需要嘅 repo secrets（Settings → Secrets and variables → Actions）：
#   APPLE_TEAM_ID            — Apple Developer Team ID（10 字）
#   ASC_KEY_ID               — App Store Connect API Key ID（10 字）
#   ASC_ISSUER_ID            — Issuer ID（UUID）
#   ASC_KEY_P8               — AuthKey_XXXX.p8 內容（base64）
#   IOS_DIST_CERT_P12        — Apple Distribution 憑證 .p12（base64）
#   IOS_DIST_CERT_PASSWORD   — 上面 .p12 嘅匯出密碼
# 逐步設定：apps/ios/CI_SETUP.md
# 可選 repo variable：IOS_BUNDLE_ID（預設 com.anthroskill.pipz）

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    # public repo → macOS runner 唔計費
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.anthroskill.pipz' }}
      XCODEGEN_VERSION: '2.42.0'

    steps:
      - uses: actions/checkout@v4

      - name: 檢查 secrets 齊唔齊
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          missing=0
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID P8 P12 P12_PASS; do
            if [ -z "${!name}" ]; then echo "::error::缺少 secret $name（見 apps/ios/CI_SETUP.md）"; missing=1; fi
          done
          exit $missing

      - name: 寫入 App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" | openssl base64 -d -A > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: 匯入 Apple Distribution 憑證到臨時 keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "${{ secrets.IOS_DIST_CERT_P12 }}" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_DIST_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "✅ 憑證已匯入"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: 安裝 XcodeGen
        run: |
          curl -sL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp
          sudo cp /tmp/xcodegen/bin/xcodegen /usr/local/bin/
          xcodegen --version

      - name: 生成 Xcode project
        working-directory: apps/ios
        run: xcodegen generate && ls -la

      - name: Archive
        working-directory: apps/ios
        run: |
          set -o pipefail
          # build number 必須大過之前上傳過嘅（Mac 上面用 YYYYMMDDHHmm ＝ 12 位），
          # 所以呢度用秒（14 位），保證永遠遞增。
          # 唔可以用 GITHUB_RUN_NUMBER —— 佢由 1 開始，會細過舊 build，ASC 會退件。
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          echo "build number: $BUILD_NUMBER"
          set -x
          xcodebuild archive \
            -project Pipz.xcodeproj \
            -scheme Pipz \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pipz.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: 匯出並上傳（exportArchive destination=upload）
        working-directory: apps/ios
        run: |
          sed -e "s|__TEAM_ID__|${TEAM_ID}|g" \
              -e "s|__BUNDLE_ID__|${BUNDLE_ID}|g" \
              -e "s|__DESTINATION__|upload|g" \
              ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          # destination=upload 會直接上傳去 App Store Connect；
          # CI 冇 Xcode 登入嘅 Apple ID，所以用 ASC API key 認證（Mac 上面跑 release.sh 就唔需要）
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pipz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 清走臨時 keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
